<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Pulse - Log In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-container">
    <h1>Campus Pulse</h1>
    <h2>Log In</h2>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" name="username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password">
      </div>

      <p id="login-error" class="error-msg" aria-live="polite"></p>

      <button type="submit" class="btn">Log In</button>
    </form>

    <p class="switch-link">
      Don't have an account? <a href="signup.html">Sign up</a>
    </p>
    <p class="switch-link"><a href="index.html">Explore campus resources</a></p>
    <p class="switch-link">Account preview: uses this browser's temporary demo storage.</p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
