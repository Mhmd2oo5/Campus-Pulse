<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Pulse - Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-container">
    <h1>Campus Pulse</h1>
    <h2>Create Account</h2>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" name="username" required minlength="3" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" required minlength="6" autocomplete="new-password">
      </div>

      <p id="signup-error" class="error-msg" aria-live="polite"></p>

      <button type="submit" class="btn">Sign Up</button>
    </form>

    <p class="switch-link">
      Already have an account? <a href="index.html">Log in</a>
    </p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
